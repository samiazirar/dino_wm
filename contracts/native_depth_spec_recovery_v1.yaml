irreducible_missing_input:
  artifact: dinocular-native-depth-contract-v1
  missing_cause: >-
    The contract's mandatory affine_mean_std checkpoint-native normalization is
    contradicted by the provenance-matched student-training source: dropout_fullpr
    was trained on raw, unnormalized metric depth (DataAugmentationMVI /
    DataAugmentationDINO apply RGB normalization only; depth is loaded and fed
    raw). A valid dinocular-native-depth-contract-v1 therefore cannot be
    reconstructed from any combination of (checkpoint metadata, student-training
    source, DA3 producer source, pinned cache manifests) without inventing the
    normalization mean/std, the neutral input, and the cache-to-native affine.
  owner: >-
    Student world-model training side (owner of the dropout_fullpr checkpoint),
    in coordination with the DA3 depth-producer tooling owner. Either (a) supply
    an owner-authored dinocular-native-depth-contract-v1 that defines a
    checkpoint-native normalization the checkpoint was NOT trained with (which
    changes the comparison and must be flagged as a non-native transformation),
    or (b) change the contract schema to admit the recovered RAW-depth native
    semantics (normalization.kind = none, identity cache->metric affine, no
    neutral, no encoder-input validity mask). Both are owner decisions, not
    recoverable values.


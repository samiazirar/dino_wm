disconfirming_result: >-
  The dinocular-native-depth-contract-v1 artifact cannot be reconstructed from
  the named evidence surfaces. The checkpoint metadata encodes no depth
  normalization (args has data paths only; patch_embed is 3-channel RGB; depth
  enters via a normalization-free DepthPatchEmbed). The provenance-matched
  student-training source (MThesis-wt commit b99422df, source SHA-256s pinned in
  models/dinocular_backbone.py:5-9) trains dropout_fullpr on RAW, UNNORMALIZED
  depth: train_mixed_v2.py uses DataAugmentationDINO + DataAugmentationMVI,
  which normalize RGB only and return depth raw, and the student diagnostics
  state 'z (raw, unnormalized depth)' (diagnostics/REPORT.md:52) and
  'unnormalized-depth input to RoPE-z' (:197). The native contract's mandatory
  encoder_input.checkpoint_native.normalization.kind = affine_mean_std is
  therefore CONTRADICTED, and the 16 fields that depend on a checkpoint-native
  normalized space (mean, std, neutral depth/mask, cache-to-native affine
  operation/output_quantity/scale/offset, clipping space/min/max, invalid_mask
  source/valid/invalid, and the output_quantity) cannot be populated without
  inventing values. The single ABSENT field (encoder-input interpolation) is not
  encoded in the student source because the student never consumed a cache. No
  value was invented. The native_v1 route in
  contracts/depth_consumption_index_v2.yaml remains
  BLOCKED_MISSING_ACCEPTED_ARTIFACT; this record strengthens the prior rejection
  at contracts/native_depth_release_independent_acceptance_v1.yaml from 'absent
  from pinned cache evidence' to 'contradicted by the student-training source'.
